name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check src tests examples alembic scripts

      - name: Format check with Ruff
        run: python -m ruff format --check src tests examples alembic scripts

      - name: Type check with Pyright
        run: python -m pyright src/

      - name: Scan forbidden dependencies and secrets
        run: python scripts/check_forbidden.py

      - name: Check wheel contents and isolated imports
        run: python scripts/check_package.py

      - name: Check SQLite migrations
        run: python scripts/check_sqlite_migrations.py

      - name: Generate and verify offline evidence
        run: |
          python scripts/portfolio_demo.py
          python scripts/verify_portfolio_evidence.py artifacts/portfolio/async-workflow-engine-evidence

      - name: Run Python tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: frontend
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build frontend container
        run: docker build --file frontend/Dockerfile frontend
